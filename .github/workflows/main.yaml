name: CI and Publish Container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -e ".[dev]"

      - name: Run tests
        run: pytest -q

  build_and_smoke_test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t harbor:ci .

      - name: Run container
        run: docker run -d --name harbor -p 8000:8000 -e PORT=8000 harbor:ci

      - name: Smoke test health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs harbor
          exit 1

      - name: Smoke test prediction
        run: |
          curl -fsS http://localhost:8000/schema \
            | python3 -c 'import json, sys; print(json.dumps(json.load(sys.stdin)["example_request"]))' > request.json
          curl -fsS -X POST http://localhost:8000/predict_api \
            -H "Content-Type: application/json" -d @request.json

      - name: Stop container
        if: always()
        run: docker rm -f harbor

  publish_ghcr:
    needs: build_and_smoke_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${{ github.sha }}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
